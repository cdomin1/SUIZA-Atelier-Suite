[package]
name = "suiza-atelier-suite"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
description = "SUIZA Atelier Suite — memory-safe creative suite (Photo / Vector / Publish) in Rust"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = true
codegen-units = 1
